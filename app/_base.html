<html>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:400,500|Roboto+Mono:400,500"

    <link href="favicon.ico" rel="icon" />
    <script>
      (function() {
        var s = null;
        try { s = localStorage.getItem('assetStudioTheme'); } catch(e) {}
        var dark = s ? (s === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
    <script
      defer
      src="https://umami-bxq054n88-do-i-need-one-s-projects.vercel.app/mango_banana"

    <script src="bg-color-suggester.js?v=20261121b"></script>
    <script src="theme-manager.js?v=20261121b"></script>

    {% block head %} {% endblock %}
  </head>
  <body class="{{ bodyClasses }}">
    {% block body %} {% endblock %}
